[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai-assistant"
version = "0.1.0"
description = "A personal AI assistant with voice, memory, vision, and permission-controlled desktop tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "SQLAlchemy>=2.0,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
ai = ["openai>=1.30,<3"]
voice = ["SpeechRecognition>=3.10,<4", "pyttsx3>=2.90,<3", "PyAudio>=0.2.14"]
vision = ["opencv-python>=4.9,<5", "Pillow>=10.3,<13"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.5,<1"]

[project.scripts]
jarvis = "jarvis.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis", "jarvis.*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
